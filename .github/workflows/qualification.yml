name: Live provider qualification

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label with network access to the vLLM host
        type: string
        default: ubuntu-24.04
        required: true
      vllm_url:
        description: Trusted OpenAI-compatible vLLM endpoint, including /v1
        type: string
        required: true
      chat_model:
        description: Reviewed native-tools chat model id
        type: string
        required: true
      enrich_model:
        description: Enrichment model id (defaults to chat_model)
        type: string
        required: false
      embed_model:
        description: Embedding model id
        type: string
        required: true
      embed_dimensions:
        description: Served embedding dimensions
        type: string
        required: true
      chat_context_window:
        description: Reviewed chat and enrichment context window
        type: string
        default: "8192"
        required: true
      chat_max_output_tokens:
        description: Reviewed chat and enrichment output-token limit
        type: string
        default: "1024"
        required: true
      embed_max_input_tokens:
        description: Reviewed embedding maximum input tokens
        type: string
        default: "8192"
        required: true

permissions:
  contents: read

env:
  DOTNET_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_XMLDOC_MODE: skip

jobs:
  qualification:
    name: Tests marked Category=Qualification
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      SECONDBRAIN_QUAL_VLLM_URL: ${{ inputs.vllm_url }}
      SECONDBRAIN_QUAL_VLLM_CHAT_MODEL: ${{ inputs.chat_model }}
      SECONDBRAIN_QUAL_VLLM_ENRICH_MODEL: ${{ inputs.enrich_model || inputs.chat_model }}
      SECONDBRAIN_QUAL_VLLM_EMBED_MODEL: ${{ inputs.embed_model }}
      SECONDBRAIN_QUAL_VLLM_DIMENSIONS: ${{ inputs.embed_dimensions }}
      SECONDBRAIN_QUAL_VLLM_CONTEXT_WINDOW: ${{ inputs.chat_context_window }}
      SECONDBRAIN_QUAL_VLLM_MAX_OUTPUT_TOKENS: ${{ inputs.chat_max_output_tokens }}
      SECONDBRAIN_QUAL_VLLM_MAX_INPUT_TOKENS: ${{ inputs.embed_max_input_tokens }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore locked dependencies
        run: dotnet restore SecondBrain.slnx --locked-mode
      - name: Build with warnings as errors
        run: dotnet build SecondBrain.slnx --configuration Release --no-restore -warnaserror -p:ContinuousIntegrationBuild=true
      - name: Run live qualification tests
        run: dotnet test SecondBrain.slnx --configuration Release --no-build --no-restore --filter 'Category=Qualification' --logger trx --results-directory TestResults
      - name: Upload qualification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
