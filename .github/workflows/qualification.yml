name: Live provider qualification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_XMLDOC_MODE: skip

jobs:
  qualification:
    name: Tests marked Category=Qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore locked dependencies
        run: dotnet restore SecondBrain.slnx --locked-mode
      - name: Build with warnings as errors
        run: dotnet build SecondBrain.slnx --configuration Release --no-restore -warnaserror -p:ContinuousIntegrationBuild=true
      # Lane B adds provider configuration and network access when qualification tests land.
      - name: Run live qualification tests
        run: dotnet test SecondBrain.slnx --configuration Release --no-build --no-restore --filter 'Category=Qualification' --logger trx --results-directory TestResults
      - name: Upload qualification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
